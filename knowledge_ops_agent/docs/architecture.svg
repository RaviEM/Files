<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect width="760" height="720" fill="#fff"/>
<text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Enterprise Knowledge Ops Agent - LangGraph architecture</text>

<g><rect x="60" y="70" width="640" height="60" rx="10" fill="#F1EFE8" stroke="#888780"/><text x="380" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Ingestion (offline)</text><text x="380" y="114" text-anchor="middle" font-size="12" fill="#5F5E5A">PDF / DOCX / MD -> RecursiveCharacterTextSplitter -> MiniLM embeddings -> Chroma (metadata: source, page, doc_type, chunk_id)</text></g>

<g><rect x="280" y="160" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="380" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C24">validate_input</text><text x="380" y="201" text-anchor="middle" font-size="12" fill="#5F5E5A">length -- injection -- PII</text></g>
<line x1="380" y1="216" x2="380" y2="246" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="280" y="250" width="200" height="56" rx="8" fill="#FBEAFO" stroke="#993556"/><text x="380" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#481528">Memory agent</text><text x="380" y="291" text-anchor="middle" font-size="12" fill="#993556">load prior turns</text></g>
<Line x1="380" y1="306" x2="380" y2="336" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="280" y="340" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="380" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Orchestrator agent</text><text x="380" y="381" text-anchor="middle" font-size="12" fill="#534AB7">plan: 1-5 sub-questions</text></g>
<line x1="380" y1="396" x2="380" y2="426" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="280" y="430" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="380" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Retriever agent</text><text x="380" y="471" text-anchor="middle" font-size="12" fill="#0F6E56">top-k per sub-task + scores</text></g>
<line x1="380" y1="486" x2="380" y2="516" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="520" y1="458" x2="482" y2="458" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="522" y="430" width="178" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="611" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Chroma vector DB</text><text x="511" y="471" text-anchor="middle" font-size="12" fill="#5F5E5A">local, persistent</text></g>

<g><rect x="280" y="520" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="380" y="542" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Analyst agent</text><text x="388" y ="561" text-anchor="middle" font-size="12" fill="#0F6E56">synthesis -> atomic claims</text></g>
<line x1="380" y1="576" x2="380" y2="606" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="280" y="610" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="380" y="632" text-anchor="middle" font-size="14" font-weight-"bold" fill="#4A1B0C">Verifier agent</text><text x="380" y="651" text-anchor="middle" font-size="12" fill="#993C1D">claim-level grounding</text></g>

<path d="M280 638 L180 638 L180 368 L270 368" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="172" y="500" text-anchor="end" font-size="12" fill="#993C1D">fail -> re-plan</text>
<text x="172" y="516" text-anchor="end" font-size="12" fill="#993C1D">(max 2 retries)</text>

<path d="M480 638 L560 638 L560 520" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="522" y="520" width="178" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="611" y="542" text-anchor="middle" font-size="14" font-weight="bold" fill="#20202A">finalize</text><text x="611" y="561 "text-anchor="middle" font-size="12" fill="#5F5E5A">answer -- sources -- confidence</text></g>

<path d="M60 182 L60 290 L278 290" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#a)"/>
<text x="68" y="178" font-size="12" fill="#5F5E5A">rejected -> finalize (refused)</text>

<rect x="522" y="610" width="178" height="56" rx="8" fill="#fff" stroke="#888780" stroke-dasharray="4 3"/><text x="611" y="632" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Run Log (JSON)</text><text x="611" y="651" text-anchor="middle" font-size="12" fill="#5F5E5A">trace -- scores -- flags</text>
<text x="380" y="700" text-anchor="middle" font-size="12" fill="#5F5E5A">Every node appends to the shared AgentState trace and evaluation lists; finalize writes them to logs/run_*.json and memory.</text>
</svg>